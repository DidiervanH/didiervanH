name: Update README

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-readme.ts"
      - ".github/workflows/update-readme.yml"
      - "assets/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate README
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: bun .github/scripts/generate-readme.ts

      - name: Render 3D contribution calendar
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # github-profile-3d-contrib 0.7.1, pinned by commit so the code run with the token cannot change.
          LIB="$RUNNER_TEMP/profile-3d-contrib"
          git init --quiet "$LIB"
          git -C "$LIB" fetch --quiet --depth 1 https://github.com/yoshi389111/github-profile-3d-contrib fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8
          git -C "$LIB" checkout --quiet FETCH_HEAD
          npm ci --ignore-scripts --prefix "$LIB"
          bun .github/scripts/render-3d-contrib.ts "$LIB"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/email-contributions.svg assets/email-contribution-stats.svg assets/email-commit-days.json assets/profile-green-animate.svg assets/profile-night-view.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update README"
          git push
